name: Security scan

# Weekly (and on-demand) gosec + govulncheck sweep. Both scanners are blocking;
# the same gate also runs per change in CI, while this schedule catches newly
# published vulnerability-database entries even when the repository is idle.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

# Least-privilege default: checkout + local gosec/govulncheck only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/private-badger
        with:
          deploy-key: ${{ secrets.BADGER_READ_DEPLOY_KEY }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make tools
      - name: gosec
        run: make security
      - name: govulncheck
        run: make vulncheck

      - name: Report check duration
        if: always()
        shell: bash
        run: |
          if [[ -n "${GO_CHECK_STARTED_AT:-}" ]]; then
            seconds=$(( $(date +%s) - GO_CHECK_STARTED_AT ))
            echo "Go check duration: ${seconds}s (including dependency setup)" >> "$GITHUB_STEP_SUMMARY"
          fi
