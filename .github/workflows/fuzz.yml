name: Fuzz

# Weekly (and on-demand) bounded fuzz run over the v4 trust-boundary decode
# and v5 temporal/state/protocol harnesses documented in SECURITY.md's
# "Fuzz harnesses" section: the
# end-to-end import pipeline, the change-log replica-apply decode path (same
# untrusted-stream contract as import — BACKLOG 12g), and the checked
# wire-decode/validate path for nodes and relationships. Each target's own
# seed corpus (committed under testdata/fuzz/) is exercised as an ordinary
# test in `make test`; this job additionally spends bounded wall-clock time
# generating NEW adversarial inputs via `go test -fuzz`, matching the
# "never panic on any (tag, payload)" contract each harness pins.
#
# Reverses the earlier "fuzzing stays out of CI" owner decision (CHANGELOG
# 4467): that decision predates a scheduled, time-boxed, non-blocking job.
# A crasher this job finds is written by `go test -fuzz` to
# testdata/fuzz/<FuzzName>/ and must be committed as a permanent regression
# seed once triaged, per the existing seed-corpus discipline.

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Per-target fuzz duration (22 targets share a 40-minute job; default 60s)"
        required: false
        default: "60s"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # Twenty-two targets at 60s leave 18 nominal minutes for setup/build/artifacts.
    timeout-minutes: 40
    env:
      FUZZTIME: ${{ inputs.fuzztime || '60s' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: FuzzImport
        run: go test -run '^$' -fuzz=FuzzImport -fuzztime="$FUZZTIME" ./pkg/graph/internal/core/

      - name: FuzzApplyChange
        run: go test -run '^$' -fuzz=FuzzApplyChange -fuzztime="$FUZZTIME" ./pkg/graph/internal/core/

      - name: FuzzWireToNodeChecked
        run: go test -run '^$' -fuzz=FuzzWireToNodeChecked -fuzztime="$FUZZTIME" ./pkg/graph/internal/storeutil/

      - name: FuzzWireToRelChecked
        run: go test -run '^$' -fuzz=FuzzWireToRelChecked -fuzztime="$FUZZTIME" ./pkg/graph/internal/storeutil/

      - name: FuzzUnmarshalNodeWireWithKeys
        run: go test -run '^$' -fuzz=FuzzUnmarshalNodeWireWithKeys -fuzztime="$FUZZTIME" ./pkg/graph/internal/storeutil/

      - name: FuzzDecodePosition (v5)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzDecodePosition -fuzztime="$FUZZTIME" ./pkg/temporal/

      - name: FuzzRegionSetAlgebra (v5)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzRegionSetAlgebra -fuzztime="$FUZZTIME" ./pkg/temporal/

      - name: FuzzDecodeScope (v5)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzDecodeScope -fuzztime="$FUZZTIME" ./pkg/temporal/

      - name: FuzzDecodeOpaqueDescriptor (v5)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzDecodeOpaqueDescriptor -fuzztime="$FUZZTIME" ./pkg/temporal/

      - name: FuzzDecodePointKnowledge (v5)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzDecodePointKnowledge -fuzztime="$FUZZTIME" ./pkg/temporal/

      - name: FuzzStateCodec (v5)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzStateCodec -fuzztime="$FUZZTIME" ./internal/state/

      - name: FuzzConsensusWirePreflight (v5)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzConsensusWirePreflight -fuzztime="$FUZZTIME" ./internal/replica/

      - name: FuzzDecodeCheckpoint (v5)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzDecodeCheckpoint -fuzztime="$FUZZTIME" ./internal/idalloc/

      - name: FuzzOpen (v5/timeblock)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzOpen -fuzztime="$FUZZTIME" ./internal/timeblock/

      - name: FuzzGraphstateDeltaAndHistoryParity (v5)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzGraphstateDeltaAndHistoryParity -fuzztime="$FUZZTIME" ./internal/graphstate/

      - name: FuzzStrictApplicationAndCheckpoint (v5)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzStrictApplicationAndCheckpoint -fuzztime="$FUZZTIME" ./internal/txnproto/

      - name: FuzzRecordCanonicalRoundTrip (v5)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzRecordCanonicalRoundTrip -fuzztime="$FUZZTIME" ./internal/assertion/

      - name: FuzzCatalogDecoders (v5)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzCatalogDecoders -fuzztime="$FUZZTIME" ./internal/graphstore/

      - name: FuzzApplicationSnapshotManifest (v5)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzApplicationSnapshotManifest -fuzztime="$FUZZTIME" ./internal/raftlog/

      - name: FuzzApplicationSnapshotImportNeverChangesActive (v5)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzApplicationSnapshotImportNeverChangesActive -fuzztime="$FUZZTIME" ./internal/raftlog/

      - name: FuzzPageDecoders (v5)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzPageDecoders -fuzztime="$FUZZTIME" ./internal/graphstore/

      - name: FuzzAssociationStoredEnvelopeFraming (v5)
        working-directory: v5
        run: go test -run '^$' -fuzz=FuzzAssociationStoredEnvelopeFraming -fuzztime="$FUZZTIME" ./internal/graphstore/

      - name: Upload any new crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: |
            pkg/graph/internal/core/testdata/fuzz/**
            pkg/graph/internal/storeutil/testdata/fuzz/**
            v5/pkg/temporal/testdata/fuzz/**
            v5/internal/state/testdata/fuzz/**
            v5/internal/raftlog/testdata/fuzz/**
            v5/internal/replica/testdata/fuzz/**
            v5/internal/idalloc/testdata/fuzz/**
            v5/internal/timeblock/testdata/fuzz/**
            v5/internal/graphstate/testdata/fuzz/**
            v5/internal/txnproto/testdata/fuzz/**
            v5/internal/assertion/testdata/fuzz/**
            v5/internal/graphstore/testdata/fuzz/**
          retention-days: 14
