name: CodeQL

# Weekly scan only, no push trigger: on every push to main it cost 849 billed minutes in a week (ai-soc's audit,
# 24-31 Oct). Default setup cannot drop its push trigger, so this replaces it; both cannot upload at once.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, go, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
