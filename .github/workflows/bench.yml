name: Bench

# Two jobs, one comparator (bench/bench-compare.sh):
#
#  - bench-gate (pull_request, BLOCKING): the wired-up flip-to-blocking plan
#    from bench/README.md. Benchmarks the PR's merge-base and HEAD on the
#    SAME runner (same noise environment) with -count=3 — benchstat then
#    compares MEDIANS, absorbing single-sample scheduler spikes — and fails
#    the check if any core scenario's median time regressed by more than
#    REGRESSION_THRESHOLD_PCT (30% here; deliberately looser than the 15%
#    local gate because GitHub-hosted runners are noisier than a dedicated
#    machine). The two long-running measurement STUDIES
#    (PinnedScanScaling, ChangeLogTxSerialization — multi-minute 100k-entity
#    fixtures built for one-off measurement campaigns, not regression
#    canaries) are excluded from the PR gate via the -bench filter; the
#    manual dispatch job still runs them.
#
#  - bench-compare (workflow_dispatch, informational): the original manual
#    full-suite comparison, unchanged in spirit — useful for sanity-checking
#    a perf claim from a fork or an ad-hoc branch without a PR.
#
# The authoritative high-resolution tooling remains LOCAL:
# make bench-baseline + make bench-check on stable hardware (bench/README.md).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pkg/**"
      - "bench/**"
      - "go.mod"
      - ".github/workflows/bench.yml"

jobs:
  bench-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      REGRESSION_THRESHOLD_PCT: "30"
      # Core regression canaries only — everything EXCEPT the two multi-minute
      # measurement studies (PinnedScanScaling, ChangeLogTxSerialization).
      # "Ingest" is a deliberate prefix match covering every ingest variant.
      BENCH_FILTER: "Benchmark(PointReadHit|LabelScan10k|TwoHop|TemporalPoint|AsOfPin|Ingest|BulkAddNodes10k|ANNSearch10k|OrderedTopK|CompositeLookup|RelPropertyLookup10k)"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Benchmark merge-base
        id: bench_base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          merge_base="$(git merge-base HEAD "origin/$BASE_REF")"
          worktree="$(mktemp -d)/bench-base"
          git worktree add --detach "$worktree" "$merge_base"
          if [[ -d "$worktree/bench" ]]; then
            (cd "$worktree" && go test -bench="$BENCH_FILTER" -benchmem -benchtime=0.3s -count=3 -run '^$' ./bench) | tee bench-base.txt
            echo "has_base=true" >> "$GITHUB_OUTPUT"
          else
            echo "bench/ suite not present at merge-base ($merge_base) — nothing to gate against." | tee bench-base.txt
            echo "has_base=false" >> "$GITHUB_OUTPUT"
          fi
          git worktree remove --force "$worktree"

      - name: Benchmark HEAD
        if: steps.bench_base.outputs.has_base == 'true'
        run: |
          go test -bench="$BENCH_FILTER" -benchmem -benchtime=0.3s -count=3 -run '^$' ./bench | tee bench-head.txt

      - name: Gate (bench-compare.sh) — BLOCKING
        if: steps.bench_base.outputs.has_base == 'true'
        run: |
          {
            echo "### bench gate — merge-base vs HEAD (medians of 3, threshold ${REGRESSION_THRESHOLD_PCT}%)"
            echo '```'
            bash bench/bench-compare.sh bench-base.txt bench-head.txt bench-gate.csv 2>&1 | tee gate-output.txt
            status=${PIPESTATUS[0]}
            echo '```'
            if [[ "$status" != "0" ]]; then
              echo "**FAILED — a core scenario regressed beyond the threshold.** Re-run the job once before concluding (shared runners are noisy); a repeated failure is a real signal. See bench/README.md."
            fi
            exit "$status"
          } >> "$GITHUB_STEP_SUMMARY"

  bench-compare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve merge-base
        id: mergebase
        run: |
          # workflow_dispatch checks out the dispatched ref directly; compare
          # it against its merge-base with origin/main (fetch-depth: 0 above
          # guarantees both histories are present). Dispatching ON main
          # compares main against itself's parent-of-merge-base, which
          # degenerates to a no-op comparison — dispatch from a branch.
          head_sha="$(git rev-parse HEAD)"
          merge_base="$(git merge-base "$head_sha" origin/main)"
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Benchmark merge-base
        id: bench_base
        run: |
          merge_base="${{ steps.mergebase.outputs.merge_base }}"
          worktree="$(mktemp -d)/bench-base"
          git worktree add --detach "$worktree" "$merge_base"
          if [[ -d "$worktree/bench" ]]; then
            (cd "$worktree" && go test -bench=. -benchmem -benchtime=0.3s -count=1 -run '^$' ./bench) | tee bench-base.txt
            echo "has_base=true" >> "$GITHUB_OUTPUT"
          else
            echo "bench/ suite not present at merge-base ($merge_base) — nothing to compare against yet." | tee bench-base.txt
            echo "has_base=false" >> "$GITHUB_OUTPUT"
          fi
          git worktree remove --force "$worktree"

      - name: Benchmark HEAD
        run: |
          git checkout "${{ steps.mergebase.outputs.head_sha }}" --quiet
          go test -bench=. -benchmem -benchtime=0.3s -count=1 -run '^$' ./bench | tee bench-head.txt

      - name: Compare (benchstat) — informational only
        continue-on-error: true
        run: |
          {
            echo "### bench/ comparison — merge-base vs HEAD"
            echo
            if [[ "${{ steps.bench_base.outputs.has_base }}" == "true" ]]; then
              command -v benchstat >/dev/null 2>&1 || go install golang.org/x/perf/cmd/benchstat@latest
              benchstat_bin="$(command -v benchstat || echo "$(go env GOPATH)/bin/benchstat")"
              echo '```'
              "$benchstat_bin" bench-base.txt bench-head.txt
              echo '```'
            else
              echo "_No merge-base benchmark available — see bench-base.txt output above (likely this is the PR introducing bench/). Nothing to compare yet._"
            fi
            echo
            echo "_Informational only — full suite incl. the measurement studies at a single -count=1 sample. The BLOCKING per-PR gate is the bench-gate job (core scenarios, medians of 3)._"
          } >> "$GITHUB_STEP_SUMMARY"
