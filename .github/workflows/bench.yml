name: Bench

# PRs run measured quick canaries. Scheduled/manual checks retain every family,
# including expensive history/ANN/scaling studies, against the SAME harness.
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-character HEAD SHA for full comparison
        required: false
      comparison_scope:
        description: Full release comparison or bounded investigation (not full release evidence)
        type: choice
        options: [full, ingest-pipeline]
        default: full
      baseline:
        description: Exact 40-character baseline SHA (default merge-base, or parent on main)
        required: false
  pull_request:
    paths:
      - 'pkg/**'
      - 'bench/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/bench.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ inputs.revision || github.ref }}
  cancel-in-progress: true

jobs:
  bench-gate:
    runs-on: ubuntu-latest
    env:
      REGRESSION_THRESHOLD_PCT: '30'
      BENCH_COUNT: '3'
      BENCHTIME: '0.3s'
      # These canaries preserve point/label/adjacency/temporal/ingest coverage.
      # The full comparison retains the remaining production-shaped families.
      BENCH_FILTER: '^Benchmark(PointReadHit|LabelScan10k|TwoHop|TemporalPoint|AsOfPin|Ingest1kSingle)$'
      PIPELINE_FILTER: '^BenchmarkIngestPipeline$/memory/(p1|p8)$'
      ALLOC_FILTER: '^BenchmarkLatestStamps$/(memory|badger)/plain$'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.revision || github.sha }}
      - uses: ./.github/actions/private-badger
        with:
          deploy-key: ${{ secrets.BADGER_READ_DEPLOY_KEY }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve immutable revisions and scope
        id: revisions
        env:
          REVISION: ${{ inputs.revision || github.sha }}
          BASELINE: ${{ inputs.baseline }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.comparison_scope || 'full' }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$REVISION" ]]
          if [[ -n "$BASELINE" ]]; then
            [[ "$BASELINE" =~ ^[0-9a-f]{40}$ ]]
            baseline="$(git rev-parse "$BASELINE^{commit}")"
            [[ "$baseline" == "$BASELINE" ]]
          else
            baseline="$(git merge-base HEAD "origin/$BASE_REF")"
            if [[ "$baseline" == "$REVISION" ]]; then
              baseline="$(git rev-parse HEAD^)"
            fi
          fi
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == 'workflow_dispatch' && "$SCOPE" == 'ingest-pipeline' ]]; then
            {
              echo 'BENCH_FILTER=^BenchmarkIngestPipeline$/memory/(p1|p8)$'
              echo 'BENCH_COUNT=7'
              echo 'BENCHTIME=1s'
              echo 'PIPELINE_FILTER='
              echo 'ALLOC_FILTER='
            } >> "$GITHUB_ENV"
            echo 'Scope: bounded pipeline p1/p8 investigation, seven 1s samples; NOT full release evidence' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$EVENT" != 'pull_request' ]]; then
            {
              echo 'BENCH_FILTER=.'
              echo 'PIPELINE_FILTER='
              echo 'ALLOC_FILTER='
            } >> "$GITHUB_ENV"
            echo 'Scope: full suite, three samples per row' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Scope: quick PR canaries, three time samples / five allocation samples' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Baseline: $baseline; HEAD: $REVISION; identical current harness" >> "$GITHUB_STEP_SUMMARY"
      - name: Benchmark baseline
        env:
          BASELINE: ${{ steps.revisions.outputs.baseline }}
        run: |
          : > bench-base.txt
          bash bench/bench-revision.sh "$BASELINE" bench-base.txt "$BENCH_FILTER" "$BENCH_COUNT" "$BENCHTIME"
          if [[ -n "$PIPELINE_FILTER" ]]; then
            bash bench/bench-revision.sh "$BASELINE" bench-base.txt "$PIPELINE_FILTER" 3
          fi
          if [[ -n "$ALLOC_FILTER" ]]; then
            bash bench/bench-revision.sh "$BASELINE" bench-base.txt "$ALLOC_FILTER" 5
          fi
      - name: Benchmark HEAD
        run: |
          : > bench-head.txt
          bash bench/bench-revision.sh HEAD bench-head.txt "$BENCH_FILTER" "$BENCH_COUNT" "$BENCHTIME"
          if [[ -n "$PIPELINE_FILTER" ]]; then
            bash bench/bench-revision.sh HEAD bench-head.txt "$PIPELINE_FILTER" 3
          fi
          if [[ -n "$ALLOC_FILTER" ]]; then
            bash bench/bench-revision.sh HEAD bench-head.txt "$ALLOC_FILTER" 5
          fi
      - name: Complete input and regression gate
        run: |
          echo '### Same-harness benchmark comparison' >> "$GITHUB_STEP_SUMMARY"
          bash bench/bench-compare.sh bench-base.txt bench-head.txt bench-gate.csv 2>&1 | tee gate-output.txt
          {
            echo '```'
            cat gate-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence-${{ github.sha }}
          path: |
            bench-base.txt
            bench-head.txt
            bench-gate.csv
            gate-output.txt
          retention-days: 14
      - name: Report check duration
        if: always()
        run: |
          if [[ -n "${GO_CHECK_STARTED_AT:-}" ]]; then
            seconds=$(( $(date +%s) - GO_CHECK_STARTED_AT ))
            echo "Benchmark duration: ${seconds}s (including dependency setup)" >> "$GITHUB_STEP_SUMMARY"
          fi
