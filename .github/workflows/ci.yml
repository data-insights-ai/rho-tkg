name: CI

# Minimal release check (RH 2026-10-23): runs when a release tag is pushed,
# or by hand on a branch before its tag (workflow_dispatch); a push to main
# without a tag runs nothing. CodeQL runs weekly from codeql.yml. The gates run
# locally before the tag: `make release`
# (scripts/release; docs/CONTRIBUTING.md § Gates).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # One test binary at a time (-p 1): with RHO_GATE=1 pkg/graph, internal/core and
      # store/tiered each peak at 7-10 GB RSS, and the default -p 4 ran three of them
      # at once on the 16 GB runner (v4.107.3: the runner killed the step, exit 143).
      - run: RHO_GATE=1 go test -short -p 1 -timeout 20m ./...
