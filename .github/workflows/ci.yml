name: CI
on:
  push:
    branches: [main, v5]
  pull_request:
    branches: [main, v5]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Explicit per-module jobs prevent recursion/duplicate gates and permit versions to diverge.
env:
  V5_DISPATCH: "0"
  COMPARE_DISPATCH: "0"
  GOTOOLCHAIN: local
  GOWORK: "off"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - module: .
            go_mod: go.mod
          - module: v5
            go_mod: v5/go.mod
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: make vet
      - run: make build
      - run: make test
      # Root v4 has large oracle suites. Keep package/test scheduling finite
      # without dropping tests or changing Go's default package timeout.
      # Let Go select CPU concurrency from the runner's affinity and CPU quota.
      - name: Root race tests with bounded concurrency
        if: matrix.module == '.'
        env:
          GOFLAGS: "-p=1 -parallel=4"
          GOMEMLIMIT: "2GiB"
        run: |
          uname -a
          nproc
          free -h
          for resource in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us /sys/fs/cgroup/memory/memory.limit_in_bytes; do
            if [ -r "$resource" ]; then
              printf '%s: ' "$resource"
              cat "$resource"
            fi
          done
          make test-race
      - run: make test-race
        if: matrix.module != '.'
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - module: .
            go_mod: go.mod
          - module: v5
            go_mod: v5/go.mod
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: make cover-gate
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - module: .
            go_mod: go.mod
            config: .golangci.yml
            only_new: true
          - module: v5
            go_mod: v5/go.mod
            config: ../.golangci.yml
            only_new: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache: true
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          only-new-issues: ${{ matrix.only_new }}
          working-directory: ${{ matrix.module }}
          args: --config ${{ matrix.config }} --timeout=5m
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - module: .
            go_mod: go.mod
          - module: v5
            go_mod: v5/go.mod
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: make tools
        working-directory: .
      - run: make security
      - run: make vulncheck
  comparison-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/graph-compare/go.mod
          cache: true
          cache-dependency-path: tools/graph-compare/go.sum
      - run: make -C tools/graph-compare tools
      - name: Native v4 correctness and tool gates
        run: make compare-ci REPRO_FLAGS="--allow-dependency-download --out $RUNNER_TEMP/rho-compare-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: native-v4-current-correctness
          path: ${{ runner.temp }}/rho-compare-evidence
          retention-days: 14
