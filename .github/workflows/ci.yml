name: CI
on:
  push:
    branches: [main, v5]
  pull_request:
    branches: [main, v5]
  workflow_dispatch:
    inputs:
      full_validation:
        description: Full phase/release validation (both modules and tool gates)
        type: boolean
        default: true
      focused_base:
        description: Optional full commit SHA ancestor for focused manual revalidation
        type: string
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Explicit per-module jobs prevent recursion/duplicate gates and permit versions to diverge.
env:
  V5_DISPATCH: "0"
  COMPARE_DISPATCH: "0"
  MIGRATION_DISPATCH: "0"
  GOTOOLCHAIN: local
  GOWORK: "off"
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      matrix: ${{ steps.plan.outputs.matrix }}
      root_behavior: ${{ steps.plan.outputs.root_behavior }}
      comparison: ${{ steps.plan.outputs.comparison }}
      migration: ${{ steps.plan.outputs.migration }}
      external: ${{ steps.plan.outputs.external }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check change-planning policy
        run: python3 -B scripts/ci-changes-test.py
      - id: plan
        run: python3 -B scripts/ci-changes.py plan --head "$GITHUB_SHA"
      - name: Changed JSON and reference checks
        if: steps.plan.outputs.full != 'true'
        env:
          CI_BASE: ${{ steps.plan.outputs.base }}
          CI_HEAD: ${{ steps.plan.outputs.head }}
        run: python3 -B scripts/ci-changes.py docs --base "$CI_BASE" --head "$CI_HEAD"
      # Routine docs already runs this finite replay check. Full dispatch also
      # checks changed CDC inputs without broadening its JSON/reference gate.
      - name: Full-scope changed CDC replay checks
        if: steps.plan.outputs.full == 'true'
        env:
          CI_BASE: ${{ steps.plan.outputs.base }}
          CI_HEAD: ${{ steps.plan.outputs.head }}
        run: python3 -B scripts/ci-changes.py cdc --base "$CI_BASE" --head "$CI_HEAD"
  # Main and explicit manual full validation retain the exhaustive gates below.
  # Routine v5 checks are deliberately not phase/release acceptance evidence.
  focused:
    needs: changes
    if: needs.changes.outputs.full != 'true' && needs.changes.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      GOFLAGS: "-p=1"
      GOMEMLIMIT: "2GiB"
      CI_BASE: ${{ needs.changes.outputs.base }}
      CI_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: make -C "${{ matrix.module }}" fmt-check
      - run: make -C "${{ matrix.module }}" vet
      - run: make -C "${{ matrix.module }}" build
      - name: Affected behavior normal, race and scoped coverage
        if: matrix.module == 'v5'
        run: python3 -B scripts/ci-changes.py run --module "${{ matrix.module }}" --base "$CI_BASE" --head "$CI_HEAD" --output "$RUNNER_TEMP/focused-${{ matrix.module == '.' && 'root' || 'v5' }}"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.module == 'v5'
        with:
          name: focused-behavior-${{ matrix.module == '.' && 'root' || 'v5' }}
          path: ${{ runner.temp }}/focused-${{ matrix.module == '.' && 'root' || 'v5' }}
          retention-days: 14
  # Root behavior no longer bundles all large packages and three modes into one
  # job. Freeze the exact affected package/compiled-parent assignment first.
  focused-root-plan:
    needs: changes
    if: needs.changes.outputs.full != 'true' && needs.changes.outputs.root_behavior == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan_sha: ${{ steps.plan.outputs.plan_sha }}
    env:
      GOFLAGS: "-p=1"
      GOMEMLIMIT: "2GiB"
      CI_BASE: ${{ needs.changes.outputs.base }}
      CI_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - id: plan
        run: python3 -B scripts/ci-changes.py root-plan --base "$CI_BASE" --head "$CI_HEAD" --output "$RUNNER_TEMP/root-plan/plan.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-root-plan
          path: ${{ runner.temp }}/root-plan/plan.json
          retention-days: 14
  focused-root-behavior:
    needs: [changes, focused-root-plan]
    if: needs.changes.outputs.full != 'true' && needs.focused-root-plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.focused-root-plan.outputs.matrix) }}
    name: focused root (${{ matrix.part }})
    env:
      GOFLAGS: "-p=1"
      GOMEMLIMIT: "2GiB"
      PLAN_SHA: ${{ needs.focused-root-plan.outputs.plan_sha }}
      ROOT_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: focused-root-plan
          path: ${{ runner.temp }}/root-plan
      - name: Partition behavior normal, race and single scoped coverage
        run: python3 -B scripts/ci-changes.py root-run --plan-file "$RUNNER_TEMP/root-plan/plan.json" --plan-sha "$PLAN_SHA" --part "$ROOT_PART" --output "$RUNNER_TEMP/focused-root-$ROOT_PART"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-behavior-root-${{ matrix.part }}
          path: ${{ runner.temp }}/focused-root-${{ matrix.part }}
          retention-days: 14
  test:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - module: .
            go_mod: go.mod
          - module: v5
            go_mod: v5/go.mod
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: make vet
      - run: make build
      - run: make test
      # v5 graphapply has the same whole-parent batching contract as root core.
      - name: v5 race tests with exhaustive graphapply batches
        if: matrix.module == 'v5'
        env:
          V5_RACE_GRAPHAPPLY_SHARDS: "4"
        run: make test-race
  # The race gate's parts, read from scripts/test-race.sh (no Go needed), so
  # the matrix below cannot drift from the script: "other", the isolated
  # packages (pkg/graph, store/memory) and core in four exhaustive batches of
  # whole top-level tests. On one 4-vCPU runner these packages shared the CPUs
  # and pkg/graph, core and memory each crossed Go's 10 min package timeout.
  race-plan:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@v7
      - run: make test-race-script
      - id: plan
        run: echo "parts=$(RACE_SHARD=list bash scripts/test-race.sh 4)" >> "$GITHUB_OUTPUT"

  # One job per part; each part is its own `go test` invocation with Go's
  # default 10 min timeout (no -timeout override). Measured <= 5 min per part
  # at GOMAXPROCS=4 (tasks/evidence/ci-race/).
  race:
    needs: [changes, race-plan]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.race-plan.outputs.parts) }}
    name: race (${{ matrix.part }})
    env:
      ROOT_RACE_CORE_SHARDS: "4"
      RACE_SHARD: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Root race tests with exhaustive core batches
        run: make test-race

  coverage:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - module: .
            go_mod: go.mod
          - module: v5
            go_mod: v5/go.mod
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: make cover-gate
  lint:
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.full != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache: true
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          only-new-issues: ${{ matrix.only_new }}
          working-directory: ${{ matrix.module }}
          args: --config ${{ matrix.config }} --timeout=5m
  security:
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: make tools
        working-directory: .
      - run: make security
      - run: make vulncheck
  comparison-correctness:
    needs: changes
    if: needs.changes.outputs.comparison == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/graph-compare/go.mod
          cache: true
          cache-dependency-path: tools/graph-compare/go.sum
      - run: make -C tools/graph-compare tools
      - name: Native v4 correctness and tool gates
        run: make compare-ci REPRO_FLAGS="--allow-dependency-download --out $RUNNER_TEMP/rho-compare-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: native-v4-current-correctness
          path: ${{ runner.temp }}/rho-compare-evidence
          retention-days: 14
  migration-preflight:
    needs: changes
    if: needs.changes.outputs.migration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/v5-migrate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/v5-migrate/go.mod
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: make fmt-check
      - run: make vet
      - run: make build
      - run: make test
      - run: make test-race
      - run: make cover-gate
      - run: make tools
      - run: make lint
      - run: make security
      - run: make vulncheck
  external-fdb-record:
    needs: changes
    if: needs.changes.outputs.external == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check changed native-module source against recorded qualification
        env:
          CI_BASE: ${{ needs.changes.outputs.base }}
          CI_HEAD: ${{ needs.changes.outputs.head }}
        run: python3 -B scripts/ci-changes.py external --base "$CI_BASE" --head "$CI_HEAD"
