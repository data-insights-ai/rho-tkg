name: CI

# Minimal release check (René 2026-10-23): runs when a release tag is pushed,
# or by hand on a branch before its tag (workflow_dispatch); a push to main
# without a tag runs nothing. CodeQL runs weekly from codeql.yml. The gates run
# locally before the tag: `make release-patch|release-minor|release-major`
# (scripts/release; docs/CONTRIBUTING.md § Gates).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -short -count=1 -timeout 20m ./...
