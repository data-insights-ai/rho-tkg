name: CI

# Minimal release check (René 2026-10-23): runs only when a release tag is
# pushed; a push to main without a tag runs nothing, and nothing is scheduled.
# The thorough gates run locally before the tag: `make ci-fast` for a patch,
# `make ci-docker` for a minor (race, gosec, govulncheck, coverage, fuzz smoke).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -short -count=1 -timeout 20m ./...
