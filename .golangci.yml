version: "2"
run:
  timeout: 5m
  go: "1.26"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - misspell
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: package-comments
          disabled: true
    govet:
      enable-all: true
      disable:
        - fieldalignment   # too noisy for type-design tradeoffs
        - shadow           # `if err := ...; err != nil` is idiomatic Go
    staticcheck:
      checks:
        - all
        - "-ST1000"   # missing package comment — noisy for internal packages
        - "-ST1023"   # redundant type — too noisy for explicit error declarations
        - "-QF1011"   # redundant type in declaration — same noise as ST1023
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unparam
          - revive
      # INTERNAL packages: an identifier is exported here only to cross the
      # internal/ package boundary, never to a user. It is not public API, and
      # godoc never renders it. Was listed per-package (core only); index and
      # storeutil are the same category and were simply never added.
      - path: pkg/graph/internal/
        text: "should have comment or be unexported"
      # STORE BACKENDS: these are Store-INTERFACE implementations whose contract is
      # documented once, on the interface in pkg/graph/store. A per-backend copy
      # would restate that contract in a fourth place and drift from it. badger and
      # tiered were already listed; memory and sharded are the same category.
      - path: pkg/graph/store/(badger|tiered|memory|sharded)/
        text: "should have comment or be unexported"
formatters:
  enable:
    - gofmt
    - goimports
